<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="BlackVault — 3D ML Escape Lab. Solve real machine learning challenges behind 5 security doors." />
  <title>BlackVault — ML Escape Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="crosshair"></div>

  <!-- HUD overlay -->
  <div id="hud">
    <div id="level-label">Level 1</div>
    <div id="stars-total">Stars: 0 / 12</div>
    <div id="doors-remaining">Doors remaining: 4</div>
    <div id="build-tag"></div>
  </div>

  <!-- Interact prompt -->
  <div id="interact-prompt" class="hidden">Press E to interact</div>

  <!-- Security Guard subtitle -->
  <div id="guard-subtitle"></div>

  <!-- Level Complete modal -->
  <div id="level-complete" class="overlay hidden">
    <div class="modal-card">
      <h2>SECTOR CLEARED</h2>
      <p id="level-complete-summary">All doors unlocked.</p>
      <p class="sub-text">Proceed to the exit vault door at the rear of the hub.</p>
    </div>
  </div>

  <!-- ML Puzzle Terminal overlay -->
  <div id="terminal" class="overlay hidden">
    <div class="terminal-window">
      <div class="terminal-header">
        <span id="terminal-title">Security Terminal</span>
        <div class="terminal-header-meta">
          <span id="terminal-timer">05:00</span>
          <span id="terminal-attempts">Attempts: 5</span>
          <button id="terminal-close" class="close-btn">&times;</button>
        </div>
      </div>

      <div class="terminal-body">
        <div class="terminal-section">
          <div id="dataset-stats" class="dataset-stats">Loading dataset info...</div>
          <div id="terminal-hint" class="terminal-hint hidden"></div>
          <div class="table-scroll-container">
            <table id="dataset-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div class="terminal-pipeline-grid">
          <div class="pipeline-column">
            <h4>Data Cleaning & Encoding</h4>
            <label class="checkbox-label">
              <input type="checkbox" id="opt-drop-duplicates" /> Drop duplicate rows
            </label>
            <label class="select-label">
              Missing values:
              <select id="opt-fill-missing">
                <option value="">Do not modify</option>
                <option value="drop_rows">Drop rows with missing values</option>
                <option value="mean">Impute with column mean</option>
                <option value="median">Impute with column median</option>
              </select>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="opt-encode" /> Encode categorical features
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="opt-scale" /> Standardize / scale features
            </label>
          </div>

          <div class="pipeline-column">
            <h4>Model Architecture</h4>
            <label class="select-label">
              Algorithm:
              <select id="opt-algorithm"></select>
            </label>
            <div id="opt-extra-params" class="extra-params-box"></div>
          </div>
        </div>

        <div class="terminal-footer">
          <button id="submit-btn" class="primary-btn">Execute Pipeline &amp; Unlock</button>
          <div id="terminal-result"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.168.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
