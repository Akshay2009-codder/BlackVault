<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlackVault // Tactical Facility Map</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="map.css" />
</head>
<body>

  <div class="crt-overlay"></div>
  <div class="crt-vignette"></div>
  <div class="noise-flicker"></div>

  <div id="mapApp" class="col" style="height:100vh; padding:16px; gap:12px; box-sizing:border-box;">

    <!-- TOP HEADER -->
    <div class="term-window">
      <div class="term-titlebar">
        <span class="term-dot live"></span>
        <span>BLACKVAULT TACTICAL FACILITY MAP</span>
        <span class="dim">/ SECTOR OVERVIEW</span>
        <span class="grow"></span>
        <span id="facilityStatus" class="glow-green">FACILITY ONLINE</span>
        <span class="grow"></span>
        <span id="playerLocation" class="glow-cyan mono">SECTOR: 01 (DATA CORE)</span>
        <span class="grow"></span>
        <a href="index.html" class="btn primary" style="padding:2px 10px; font-size:11px; text-decoration:none;">◀ BACK TO TERMINAL</a>
      </div>
    </div>

    <!-- MAIN GRID CONTAINER -->
    <div class="flex gap-16 grow" style="min-height:0;">

      <!-- LEFT: SVG CANVAS VISUALIZER -->
      <div class="term-window col grow" style="position:relative; overflow:hidden;">
        <div class="term-titlebar">
          <span class="term-dot"></span> SCHEMATIC VECTOR GRID
          <span class="grow"></span>
          <div class="flex gap-6">
            <button class="btn filter-btn active" data-filter="ALL">ALL SECTORS</button>
            <button class="btn filter-btn" data-filter="UNLOCKED">UNLOCKED</button>
            <button class="btn filter-btn" data-filter="SEALED">SEALED</button>
          </div>
          <span class="grow"></span>
          <button id="zoomInBtn" class="btn" style="padding:1px 6px;">+</button>
          <button id="zoomOutBtn" class="btn" style="padding:1px 6px;">-</button>
          <button id="resetMapBtn" class="btn" style="padding:1px 6px;">RESET</button>
        </div>


        <div id="svgContainer" style="width:100%; height:100%; position:relative; background:#04090d; cursor:grab;">
          <!-- SVG element populated dynamically by map_canvas.js -->
          <svg id="facilitySvg" width="100%" height="100%" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.07)" stroke-width="1"/>
              </pattern>
              <linearGradient id="energyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
                <stop offset="100%" stop-color="#00ff66" stop-opacity="0.2"/>
              </linearGradient>
            </defs>
            <rect width="100%" height="100%" fill="url(#gridPattern)" />
            <g id="mapEdges"></g>
            <g id="mapNodes"></g>
            <g id="radarSweep"></g>
          </svg>
        </div>
      </div>

      <!-- RIGHT: SECTOR INSPECTOR & CONTROLS -->
      <div class="term-window col" style="width:340px; min-width:320px;">
        <div class="term-titlebar"><span class="term-dot"></span> SECTOR_INSPECTOR</div>
        <div style="padding:14px; overflow-auto;" class="grow col gap-12">

          <div>
            <div class="dim mono" style="font-size:10px; letter-spacing:0.1em;">SELECTED SECTOR</div>
            <div id="inspectorName" class="glow-cyan mono" style="font-size:16px; margin-top:4px;">SEC_01 // DATA CORE</div>
          </div>

          <div style="border-top:1px solid var(--panel-line); padding-top:10px;">
            <div class="dim mono" style="font-size:10px;">STATUS & CLEARANCE</div>
            <div id="inspectorStatus" class="glow-green mono" style="font-size:12px; margin-top:4px;">STATUS: UNLOCKED [LEVEL 1]</div>
          </div>

          <div style="border-top:1px solid var(--panel-line); padding-top:10px;">
            <div class="dim mono" style="font-size:10px;">ENVIRONMENTAL HAZARD</div>
            <div id="inspectorHazard" class="glow-red mono" style="font-size:11px; margin-top:4px;">SPARKS & CORRUPT DATA STREAM</div>
          </div>

          <div style="border-top:1px solid var(--panel-line); padding-top:10px;" class="grow">
            <div class="dim mono" style="font-size:10px; margin-bottom:6px;">SECTOR TERMINALS</div>
            <div id="inspectorTerminals" class="col gap-6"></div>
          </div>

          <div style="border-top:1px solid var(--panel-line); padding-top:12px;" class="col gap-8">
            <button id="launchTerminalBtn" class="btn primary" style="width:100%;">▶ INTERACT WITH TERMINAL</button>
            <button id="fastTravelBtn" class="btn" style="width:100%;">⚡ TELEPORT TO SECTOR</button>
          </div>

        </div>
      </div>

    </div>
  </div>

  <script src="game.js"></script>
  <script src="map_canvas.js"></script>
</body>
</html>
