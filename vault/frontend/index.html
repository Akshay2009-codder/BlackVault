<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>BLACKVAULT</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="scene"></canvas>

  <!-- Crosshair -->
  <div id="crosshair"></div>

  <!-- Progression HUD: rank, XP, unlocked badges -->
  <div id="hud">
    <div class="hud-rank" id="hud-rank">RECRUIT</div>
    <div class="hud-xp-bar"><div class="hud-xp-fill" id="hud-xp-fill"></div></div>
    <div class="hud-xp-label" id="hud-xp-label">0 XP</div>
    <div class="hud-badges" id="hud-badges"></div>
  </div>

  <!-- Interact prompt -->
  <div id="interact-prompt" class="hidden">[ E ] INTERACT</div>

  <!-- Start / click-to-play overlay -->
  <div id="start-screen">
    <div class="start-inner">
      <div class="eyebrow">CLASSIFIED // OP-19</div>
      <h1>BLACKVAULT</h1>
      <p>Your phone is ringing. Click to begin.</p>
      <button id="start-btn">ENTER</button>
    </div>
  </div>

  <!-- Cutscene / dialogue overlay -->
  <div id="cutscene" class="hidden">
    <div class="cutscene-box">
      <div id="cutscene-speaker" class="eyebrow"></div>
      <p id="cutscene-text"></p>
      <button id="cutscene-next">CONTINUE ▸</button>
    </div>
  </div>

  <!-- Map / travel overlay -->
  <div id="map-screen" class="hidden">
    <div class="map-inner">
      <div class="eyebrow">TARGET LOCATION</div>
      <h2>Meridian Research Facility</h2>
      <div class="map-graphic">
        <svg viewBox="0 0 300 200">
          <circle cx="60" cy="150" r="5" fill="#5EC8D8"/>
          <line x1="60" y1="150" x2="230" y2="55" stroke="#5EC8D8" stroke-width="1.5" stroke-dasharray="4 4"/>
          <circle cx="230" cy="55" r="6" fill="#E8A33D"/>
          <text x="40" y="170" fill="#8fa3ad" font-size="10" font-family="JetBrains Mono">YOU</text>
          <text x="205" y="42" fill="#E8A33D" font-size="10" font-family="JetBrains Mono">FACILITY</text>
        </svg>
      </div>
      <button id="travel-btn">TRAVEL TO SITE ▸</button>
    </div>
  </div>

  <!-- ML Puzzle terminal overlay -->
  <div id="puzzle-screen" class="hidden">
    <div class="terminal">
      <div class="terminal-header">
        <span id="puzzle-title">SECURITY TERMINAL</span>
        <span id="puzzle-timer">--:--</span>
      </div>

      <div class="terminal-body">
        <div class="terminal-brief">
          <p>Objective: reach <b id="puzzle-metric-label">F1 ≥ 0.00</b> on the holdout set to disengage this lock.</p>
          <p class="data-report">
            Rows: <span id="stat-rows">-</span> ·
            Missing cells: <span id="stat-missing">-</span> ·
            Duplicate rows: <span id="stat-dupes">-</span>
          </p>
        </div>

        <div class="table-wrap">
          <table id="preview-table"></table>
        </div>

        <div class="controls-grid">
          <div class="control-block">
            <label>Missing values</label>
            <select id="ctl-missing">
              <option value="drop_rows">Drop affected rows</option>
              <option value="mean_impute">Mean impute</option>
              <option value="median_impute">Median impute</option>
            </select>
          </div>
          <div class="control-block checkbox-block">
            <label><input type="checkbox" id="ctl-dupes" checked/> Drop duplicate rows</label>
          </div>
          <div class="control-block checkbox-block">
            <label><input type="checkbox" id="ctl-scale"/> Scale features (standardize)</label>
          </div>
          <div class="control-block">
            <label>Model</label>
            <select id="ctl-model"></select>
          </div>
          <div class="control-block hidden" id="ctl-clusters-row">
            <label>Number of clusters (k)</label>
            <input type="number" id="ctl-clusters" min="2" max="10" value="3" />
          </div>
          <div class="control-block hidden" id="ctl-contamination-row">
            <label>Expected anomaly rate</label>
            <input type="number" id="ctl-contamination" min="0.01" max="0.3" step="0.01" value="0.05" />
          </div>
        </div>

        <div class="terminal-actions">
          <button id="submit-btn">RUN PIPELINE ▸</button>
          <span id="puzzle-result"></span>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
